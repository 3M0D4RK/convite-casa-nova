<!DOCTYPE html><html lang="pt-BR"><head>	<meta charset="UTF-8">	<meta name="viewport" content="width=device-width, initial-scale=1.0">	<title>Chá de casa nova</title>	<style>		:root { --olive: #3d4522; --ink: #30351e; --paper: #f4eee1; --sage: #899778; --line: rgba(61, 69, 34, .25); --shadow: 0 22px 70px rgba(46, 48, 28, .25); }		* { box-sizing: border-box; }		body { margin: 0; min-height: 100vh; color: var(--ink); background: #d8d1bd; font-family: 'Trebuchet MS', Arial, sans-serif; }		.page { min-height: 100vh; display: grid; place-items: center; padding: 28px; background: radial-gradient(circle at 15% 20%, rgba(137, 151, 120, .18), transparent 28%), radial-gradient(circle at 85% 80%, rgba(175, 146, 104, .16), transparent 30%), #d8d1bd; }		.invite { position: relative; width: min(100%, 540px); height: min(100vh, 810px); overflow: hidden; background: var(--paper); box-shadow: var(--shadow); animation: appear .7s ease both; }		.invite::after { content: ''; position: absolute; inset: 0; z-index: 0; background: url('capa.jpg') center / contain no-repeat; animation: houseBreath 6s ease-in-out infinite; transform-origin: center center; }		.invite::before { content: ''; position: absolute; inset: 14px; border: 1px solid var(--line); pointer-events: none; }		.admin-access { position: absolute; top: 28px; left: 28px; z-index: 4; display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid rgba(67, 70, 38, .22); border-radius: 50%; color: var(--olive); background: rgba(239, 231, 210, .9); box-shadow: 0 4px 12px rgba(62, 63, 39, .14); font: 700 10px Arial, sans-serif; letter-spacing: .5px; text-decoration: none; transition: transform .2s ease, background .2s ease; }		.admin-access:hover { background: #e6dec6; transform: rotate(-8deg) scale(1.06); }		.admin-access:focus-visible { outline: 3px solid #9aa477; outline-offset: 3px; }		.music-toggle { position: absolute; top: 28px; right: 28px; z-index: 4; display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid rgba(67, 70, 38, .22); border-radius: 50%; color: var(--olive); background: rgba(239, 231, 210, .9); box-shadow: 0 4px 12px rgba(62, 63, 39, .14); cursor: pointer; font: 700 10px Arial, sans-serif; letter-spacing: .3px; transition: transform .2s ease, background .2s ease; }		.music-toggle:hover { background: #e6dec6; transform: rotate(8deg) scale(1.06); }		.music-toggle:focus-visible { outline: 3px solid #9aa477; outline-offset: 3px; }		.music-toggle.playing { color: #f7f3e8; background: var(--olive); }		.share-access { position: absolute; top: 80px; right: 28px; z-index: 4; display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid rgba(67, 70, 38, .22); border-radius: 50%; color: var(--olive); background: rgba(239, 231, 210, .9); box-shadow: 0 4px 12px rgba(62, 63, 39, .14); cursor: pointer; font: 700 17px Arial, sans-serif; transition: transform .2s ease, background .2s ease; }		.share-access:hover { background: #e6dec6; transform: rotate(-8deg) scale(1.06); }		.share-access:focus-visible { outline: 3px solid #9aa477; outline-offset: 3px; }		.countdown { position: absolute; z-index: 2; top: 3.8%; left: 50%; color: var(--olive); font: 700 clamp(15px, 2.1vw, 24px) Arial, sans-serif; letter-spacing: 1px; text-align: center; text-shadow: 0 1px 2px rgba(255, 253, 245, .7); white-space: nowrap; transform: translateX(-50%); }		.guest-count { position: absolute; z-index: 2; top: 1.5%; left: 50%; color: #77765e; font: 600 clamp(11px, 1.4vw, 15px) 'Trebuchet MS', Arial, sans-serif; letter-spacing: .5px; text-align: center; white-space: nowrap; transform: translateX(-50%); }		.welcome-screen { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; overflow: hidden; background: radial-gradient(circle at 15% 15%, rgba(137, 151, 120, .28), transparent 28%), radial-gradient(circle at 86% 84%, rgba(180, 145, 105, .2), transparent 30%), var(--paper); transition: opacity .45s ease, visibility .45s ease; }		.welcome-screen.started { opacity: 0; visibility: hidden; pointer-events: none; }		.welcome-content { position: relative; width: min(100%, 520px); padding: clamp(54px, 10vh, 92px) 30px; border: 1px solid var(--line); text-align: center; background: rgba(255, 253, 245, .34); box-shadow: 0 18px 50px rgba(68, 67, 40, .1); }		.welcome-screen.started .welcome-content { animation: envelopeOpen .55s ease both; }		.welcome-content::before { content: ''; position: absolute; inset: 12px; border: 1px solid rgba(61, 69, 34, .18); pointer-events: none; }		.welcome-content h1 { position: relative; margin: 0; color: var(--olive); font-family: 'Palatino Linotype', 'Book Antiqua', Georgia, serif; font-size: clamp(40px, 8vw, 78px); font-weight: 400; line-height: .9; }		.welcome-content p { position: relative; margin: 22px 0 30px; color: #77765e; font-size: 16px; line-height: 1.5; }		.date-seal { position: relative; display: grid; width: 70px; height: 70px; margin: 0 auto 22px; place-items: center; border: 1px solid rgba(61, 69, 34, .35); border-radius: 50%; color: var(--olive); font: 700 11px/1.35 Arial, sans-serif; letter-spacing: 1px; }		.date-seal::before { content: ''; position: absolute; inset: 5px; border: 1px solid rgba(61, 69, 34, .2); border-radius: 50%; }		.start-button { position: relative; padding: 15px 30px; border: 0; border-radius: 999px; color: #f7f3e8; background: var(--olive); cursor: pointer; font: 700 12px Arial, sans-serif; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 5px 15px rgba(46, 48, 28, .2); transition: transform .2s ease, box-shadow .2s ease; }		.start-button:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(46, 48, 28, .28); }		.start-button:focus-visible { outline: 3px solid #9aa477; outline-offset: 3px; }		.confetti { position: absolute; top: -14px; left: 50%; width: 9px; height: 18px; opacity: 0; pointer-events: none; animation: confettiFall 1.8s ease-out forwards; }		.confetti::before { content: ''; display: block; width: 100%; height: 100%; background: var(--confetti-color); transform: rotate(var(--confetti-rotate)); }		.welcome-leaves { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }		.welcome-leaves .leaf { opacity: .7; }		.hero-content { display: contents; }		.buttons { position: absolute; z-index: 2; left: 5%; right: 5%; bottom: 17%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.5%; animation: buttonsReveal .8s .35s ease both; }		.button { min-width: 0; padding: 14px 8px; border: 1px solid rgba(67, 70, 38, .18); border-radius: 999px; color: var(--olive); background: rgba(239, 231, 210, .92); box-shadow: 0 4px 10px rgba(62, 63, 39, .12); font: 700 clamp(9px, 1.2vw, 13px)/1.1 'Trebuchet MS', Arial, sans-serif; text-align: center; text-decoration: none; transition: transform .2s ease, filter .2s ease; animation: buttonFloat var(--button-speed) ease-in-out infinite; }		.button:first-child { color: #f7f3e8; background: rgba(57, 65, 29, .94); --button-speed: 4.8s; animation: buttonFloat var(--button-speed) ease-in-out infinite, buttonPulse 3.2s 1.4s ease-in-out infinite; }		.button:nth-child(2) { --button-speed: 5.6s; animation-delay: .12s; } .button:nth-child(3) { --button-speed: 4.2s; animation-delay: .24s; } .button:nth-child(4) { --button-speed: 6.1s; animation-delay: .36s; }		.button:hover { filter: brightness(1.08); transform: translateY(-3px); }		.button:focus-visible { outline: 3px solid #9aa477; outline-offset: 3px; }		.agenda-confirm { display: inline-block; margin-top: 18px; }		.kicker { margin: 0 0 12px; color: #7b8060; font: 700 11px Arial, sans-serif; letter-spacing: 3px; text-transform: uppercase; }		.title { max-width: 700px; margin: 0; color: var(--olive); font-family: 'Palatino Linotype', 'Book Antiqua', Georgia, serif; font-size: clamp(52px, 8vw, 96px); font-weight: 400; line-height: .87; }		.names { margin: 20px 0 0; color: var(--olive); font-family: 'Palatino Linotype', 'Book Antiqua', Georgia, serif; font-size: clamp(28px, 4vw, 48px); font-style: italic; font-weight: 400; }		.subtitle { margin: 11px 0 0; color: #787657; font-size: clamp(15px, 2vw, 20px); letter-spacing: 1px; }		.house { position: relative; width: min(100%, 430px); height: 220px; margin: 26px 0 20px; }		.house-body { position: absolute; left: 12%; right: 12%; bottom: 8px; height: 125px; border: 4px solid #535a36; border-top: 0; background: #ddd5bd; box-shadow: inset 0 0 0 6px rgba(255, 252, 238, .35); }		.roof { position: absolute; left: 8%; right: 8%; top: 28px; height: 145px; border-top: 6px solid #535a36; transform: rotate(0deg); clip-path: polygon(50% 0, 100% 65%, 96% 69%, 50% 13%, 4% 69%, 0 65%); background: #89916d; }		.door { position: absolute; left: calc(50% - 27px); bottom: 0; width: 54px; height: 84px; border: 4px solid #535a36; border-bottom: 0; border-radius: 28px 28px 0 0; background: #aeb29a; }		.window { position: absolute; bottom: 54px; width: 54px; height: 48px; border: 4px solid #535a36; background: linear-gradient(90deg, transparent 46%, #535a36 46% 54%, transparent 54%), linear-gradient(0deg, transparent 46%, #535a36 46% 54%, transparent 54%), #f7f0d8; }		.window.left { left: 18%; } .window.right { right: 18%; }		.heart { position: absolute; top: 74px; left: calc(50% - 13px); color: #a46b5b; font-size: 28px; }		.event { display: flex; align-items: center; gap: 18px; margin-bottom: 26px; color: var(--olive); font-size: clamp(16px, 2vw, 21px); }		.event span { display: block; width: 7px; height: 7px; border-radius: 50%; background: #a88964; }		@keyframes appear { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }		@keyframes houseBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.018); } }
